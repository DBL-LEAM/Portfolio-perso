<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0B0B0C" />

  <title>404 — Page introuvable · Maël</title>
  <meta name="description" content="Cette adresse ne correspond à aucune page du site." />
  <!-- Une page d'erreur ne doit pas être indexée, mais ses liens peuvent être suivis. -->
  <meta name="robots" content="noindex, follow" />

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0B0C'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23F4F1EA' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />

  <!-- Typographie : identique à l'accueil (déjà en cache si l'accueil a été vu) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Unbounded:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Styles : notfound.css s'insère entre sections.css et responsive.css -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/notfound.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <!-- ============================ NAV ============================ -->
  <!-- Mêmes liens que l'accueil, préfixés par index.html puisqu'on n'est
       plus sur la page unique. -->
  <header class="nav" id="nav">
    <div class="shell nav__inner">
      <a class="nav__brand" href="index.html">Maël<span>.</span></a>

      <nav class="nav__links" id="nav-menu" aria-label="Navigation principale">
        <a href="index.html#realisations">Réalisations</a>
        <a href="index.html#parcours">Parcours</a>
        <a href="index.html#contact">Contact</a>
        <a href="index.html#contact" class="nav__cta link-arrow">Parlons de votre projet</a>
      </nav>

      <button class="nav__toggle" id="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false"
        aria-controls="nav-menu">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ============================ 404 ============================ -->
  <!-- Un seul écran : le code d'erreur en grand dans la typographie du hero,
       une ligne, une sortie. Rien n'est masqué en attendant un script
       (pas de .reveal) — c'est le seul chemin de sortie de la page. -->
  <main class="section section--ink nf" id="contenu">
    <canvas class="hero__beams" aria-hidden="true"></canvas>

    <div class="shell nf__inner">
      <h1 class="nf__title">
        <span class="nf__code">404<span class="nf__dot">.</span></span>
        <span class="nf__label">Page introuvable</span>
      </h1>

      <p class="nf__lead">Mon site tient en une seule page. Ce n'est pas celle-ci.</p>

      <a href="index.html" class="btn-beam btn-beam--solid nf__action">
        <span class="btn-beam__face">Retour à l'accueil</span>
      </a>
    </div>
  </main>

  <!-- Scripts : uniquement ceux dont la page se sert — le menu mobile de la
       navbar et les faisceaux du fond. -->
  <script src="js/navigation.js" defer></script>
  <script src="js/beams.js" defer></script>
</body>

</html>
